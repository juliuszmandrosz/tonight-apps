name: common
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=2.18.0 <3.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Money and currency classes
  money2: ^3.1.2

  # Url
  url_launcher: ^6.1.10

  # Http
  dio: ^4.0.6

  # Reactive programming
  rxdart: ^0.27.7

  # Comparison of reference types
  equatable: ^2.0.5

  # Icons
  font_awesome_flutter: ^10.4.0

  # Data classes / unions annotations
  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.0

  # Functional programming
  dartz: ^0.10.1

  # Fonts
  google_fonts: ^4.0.3

  # Network check
  connectivity_plus: ^3.0.3

  # Animations
  lottie: ^2.2.0

  # Env variables
  flutter_dotenv: ^5.0.2

  # Router
  auto_route: ^5.0.4

  # Forms validation
  formz: ^0.4.1

  # React-like hooks
  flutter_hooks: ^0.18.6

  # State management
  flutter_bloc: ^8.1.2
  bloc_concurrency: ^0.2.1
  hydrated_bloc: ^8.1.0

  # Dependency injection
  get_it: ^7.2.0

  # Firebase
  firebase_core: ^2.7.1
  cloud_firestore: ^4.4.4
  firebase_auth: ^4.2.10
  firebase_app_check: ^0.1.1+13
  firebase_crashlytics: ^3.0.16
  firebase_remote_config: ^3.0.14
  firebase_dynamic_links: ^5.0.16
  firebase_performance: ^0.9.0+15
  firebase_analytics: ^10.1.5
  firebase_storage: ^11.0.15
  cloud_functions: ^4.0.12
  firebase_messaging: ^14.2.6

  # Logging
  logger: ^1.3.0

  # Random id
  uuid: ^3.0.7

  # Mocking dart classes
  mockito: ^5.3.2

  # Mocking Firebase components
  firebase_auth_mocks: ^0.11.0
  fake_cloud_firestore: ^2.4.1+1

  # Widgets
  auto_size_text: ^3.0.0
  loader_overlay: ^2.1.0
  flutter_svg: ^2.0.3
  flutter_rating_bar: ^4.0.1

  # Cupertino UI icons
  cupertino_icons: ^1.0.5

  # Launch review in app stores
  launch_review: ^3.0.1

  # Splash screen
  flutter_native_splash: ^2.2.19

  # Format date in time ago format
  timeago: ^3.2.2

  # Query info about app package
  package_info_plus: ^3.0.3

  # Native share
  share_plus: ^6.3.1

  # Show images from the internet and keep them in the cache directory
  cached_network_image: ^3.2.3

  # Finding commonly used locations on the filesystem
  path_provider: ^2.0.13

  # Loading indicators
  flutter_spinkit: ^5.1.0

  # Additional functions for lists
  collection: ^1.17.0

  # Image compressing
  flutter_image_compress: ^1.1.3

  # Image picker
  file_picker: ^5.2.6

  # Google maps SDK
  google_maps_flutter: ^2.2.5

  # Image functions
  image: ^4.0.15

  # Place from location
  geocoding: ^2.1.0

  # Inherited packages
  intl:

  translations:
    path: ../translations

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^2.3.2
  json_serializable: ^6.6.1
  auto_route_generator: ^5.0.3
  flutter_lints: ^2.0.1


