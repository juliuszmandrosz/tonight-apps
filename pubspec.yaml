name: raver_common
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=2.16.1 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.1.4
  logger: ^1.1.0
  dartz: ^0.10.1
  freezed_annotation: ^2.0.3
  font_awesome_flutter: ^10.1.0
  flutter_bloc: ^8.0.1
  rxdart: ^0.27.3
  bloc_concurrency: ^0.2.0
  cloud_firestore: ^3.1.10
  equatable: ^2.0.3
  intl: ^0.17.0
  money2: ^3.1.2
  json_serializable: ^6.2.0
  firebase_auth: ^3.3.17
  google_fonts: ^3.0.0
  connectivity_plus: ^2.3.0
  firebase_crashlytics: ^2.8.1
  firebase_remote_config: ^2.0.9
  lottie: ^1.2.2
  auto_route: ^4.0.1
  typesense: ^0.2.0
  dio: ^4.0.6
  flutter_dotenv: ^5.0.2
  firebase_app_check: ^0.0.6+16

  raver_translations:
    git:
      url: git@github.com:juliuszmandrosz/RaverTranslations.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  build_runner: ^2.1.8
  freezed: ^2.0.3


